name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: director-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          gh release create "$TAG_NAME" "$APK_FILE" \
            --title "Release $TAG_NAME" \
            --notes "Automated release build #${{ github.run_number }}" \
            --target "${{ github.sha }}"
